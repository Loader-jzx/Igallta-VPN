name: Build Igallta VPN APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: arm64-v8a
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.6"
          cache: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache: true
          cache-dependency-path: core/go.sum

      - name: Set up Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal \
            --target aarch64-linux-android
          rustup default 1.99.0
          rustc --version
          cargo --version

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Configure optional release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/keystore.jks
            cat > android/local.properties <<EOF
          sdk.dir=${ANDROID_SDK_ROOT}
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
            echo "Release signing enabled from repository secrets."
          else
            echo "No signing secrets; building release-mode APK with debug signing for post-download re-sign."
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release \
            --target-platform android-arm64 \
            --no-pub 2>&1 | tee build.log
          cp build/app/outputs/flutter-apk/app-release.apk \
            "Igallta-VPN-arm64-v8a.apk"

      - name: Publish build log
        if: always()
        run: |
          if [ -f build.log ]; then
            echo "## Build log tail" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 250 build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Commit failure log to repository
        if: failure()
        run: |
          if [ ! -f build.log ]; then
            echo "No build.log to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build.log
          git commit -m "ci: record build failure log [skip ci]" || true
          git push

      - name: Verify signature
        run: |
          apksigner verify --print-certs "Igallta-VPN-arm64-v8a.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Igallta-VPN-arm64-v8a
          path: Igallta-VPN-arm64-v8a.apk
          if-no-files-found: error

  release:
    name: Publish tag release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          pattern: Igallta-VPN-*
          path: artifacts
          merge-multiple: true

      - name: List APKs
        run: ls -lh artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
