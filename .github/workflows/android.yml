name: Build Igallta VPN APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: android-arm64
          - abi: x86_64
            target: android-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.6"
          cache: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache: true
          cache-dependency-path: core/go.sum

      - name: Set up Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal \
            --target aarch64-linux-android,x86_64-linux-android
          rustup default 1.99.0
          rustc --version
          cargo --version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "ndk;28.2.13676358"
          yes | sdkmanager --licenses > /dev/null

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev cmake ninja-build pkg-config libssl-dev

      - name: Configure optional release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/keystore.jks
            cat > android/local.properties <<EOF
          sdk.dir=${ANDROID_SDK_ROOT}
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
            echo "Release signing enabled from repository secrets."
          else
            echo "No signing secrets; building release-mode APK with debug signing for post-download re-sign."
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release \
            --target-platform ${{ matrix.target }} \
            --no-pub
          cp build/app/outputs/flutter-apk/app-release.apk \
            "Igallta-VPN-${{ matrix.abi }}.apk"

      - name: Verify signature
        run: |
          apksigner verify --print-certs "Igallta-VPN-${{ matrix.abi }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Igallta-VPN-${{ matrix.abi }}
          path: Igallta-VPN-${{ matrix.abi }}.apk
          if-no-files-found: error

  release:
    name: Publish tag release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          pattern: Igallta-VPN-*
          path: artifacts
          merge-multiple: true

      - name: List APKs
        run: ls -lh artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
